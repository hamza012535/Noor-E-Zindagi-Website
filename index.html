    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('nez_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var path = window.location.pathname.toLowerCase();
          var savedLang = localStorage.getItem('nez_lang');
          var lang = 'en';
          if (path.indexOf('/ur') === 0) lang = 'ur';
          else if (path.indexOf('/roman-urdu') === 0) lang = 'roman-urdu';
          else if (path.indexOf('/en') === 0) lang = 'en';
          else if (savedLang === 'ur' || savedLang === 'roman-urdu' || savedLang === 'en') {
            lang = savedLang;
          } else if (navigator.language && navigator.language.toLowerCase().indexOf('ur') === 0) {
            lang = 'ur';
          }
          document.documentElement.lang = lang === 'roman-urdu' ? 'ur-Latn' : lang;
          document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
